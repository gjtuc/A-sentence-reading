# 무엇을: PR·main 에서 pytest CI.
# 왜: merge 전 회귀 차단 (design/32).
# 다음에: CD 는 deploy-cloud-run.yml (vars.ASR_CD_ENABLED=1 일 때만).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pytest httpx

      - name: Pytest
        env:
          ASR_SKIP_ENV_FILE: "1"
        run: python -m pytest -q --tb=short
