# 무엇을: main 푸시·수동으로 Cloud Run 배포 (선택).
# 왜: design/25 수동 배포 다음 단계 — PC 없이 재배포 (design/32).
# 불변: SA JSON·API 키를 이미지에 넣지 않음 — GitHub Secrets → env-vars-file.
# 게이트: repository variable ASR_CD_ENABLED=1 일 때만 job 실행 (기본 off).
name: Deploy Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "scripts/deploy_cloud_run.sh"
      - "scripts/deploy_capacity_profile.sh"
      - "scripts/capacity_profiles/**"
      - "scripts/pre_deploy_guard.py"
      - ".github/workflows/deploy-cloud-run.yml"

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ASR_CD_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-deploy guard (design/155)
        env:
          ASR_CLOUD_RUN_URL: ${{ vars.ASR_CLOUD_RUN_URL || 'https://asr-sentence-reading-984608876300.asia-northeast3.run.app' }}
        run: |
          python scripts/pre_deploy_guard.py \
            --url "${ASR_CLOUD_RUN_URL%/}/api/status"

      - name: Require deploy secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ASR_GOOGLE_CLIENT_ID: ${{ secrets.ASR_GOOGLE_CLIENT_ID }}
          ASR_AUTH_SECRET: ${{ secrets.ASR_AUTH_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
          AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
        run: |
          missing=0
          for name in GCP_SA_KEY ASR_GOOGLE_CLIENT_ID ASR_AUTH_SECRET GEMINI_API_KEY; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "missing secret: $name" >&2
              missing=1
            fi
          done
          # design/154 — Azure DI 필수 when ASR_AZURE_LAYOUT≠0 (기본 1). 없으면 CD가 키를 지워 Live가 PyMuPDF fallback.
          if [ "${{ vars.ASR_AZURE_LAYOUT || '1' }}" != "0" ]; then
            for name in AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT AZURE_DOCUMENT_INTELLIGENCE_KEY; do
              eval "val=\${$name}"
              if [ -z "$val" ]; then
                echo "missing secret: $name (required for figure slot carousel)" >&2
                missing=1
              fi
            done
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Set GitHub Actions secrets (see docs/design/32-github-cd.md · design/154)." >&2
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        env:
          ASR_GOOGLE_CLIENT_ID: ${{ secrets.ASR_GOOGLE_CLIENT_ID }}
          ASR_AUTH_SECRET: ${{ secrets.ASR_AUTH_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASR_ADMIN_EMAILS: ${{ secrets.ASR_ADMIN_EMAILS }}
          ASR_KAKAO_REST_API_KEY: ${{ secrets.ASR_KAKAO_REST_API_KEY }}
          ASR_KAKAO_CLIENT_SECRET: ${{ secrets.ASR_KAKAO_CLIENT_SECRET }}
          # design/86 — optional; empty → magic request stays smtp_not_configured.
          ASR_SMTP_HOST: ${{ secrets.ASR_SMTP_HOST }}
          ASR_SMTP_FROM: ${{ secrets.ASR_SMTP_FROM }}
          ASR_SMTP_USER: ${{ secrets.ASR_SMTP_USER }}
          ASR_SMTP_PASS: ${{ secrets.ASR_SMTP_PASS }}
          ASR_SMTP_PORT: ${{ secrets.ASR_SMTP_PORT }}
          ASR_SMTP_SSL: ${{ secrets.ASR_SMTP_SSL }}
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
          AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
          ASR_AZURE_LAYOUT: ${{ vars.ASR_AZURE_LAYOUT || '1' }}
          ASR_CLOUD_RUN_URL: ${{ vars.ASR_CLOUD_RUN_URL || 'https://asr-sentence-reading-984608876300.asia-northeast3.run.app' }}
          ASR_GCS_BUCKET: ${{ vars.ASR_GCS_BUCKET || 'asr-chaheon-warehouse' }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'peaceful-basis-503207-t4' }}
          ASR_CLOUD_RUN_REGION: ${{ vars.ASR_CLOUD_RUN_REGION || 'asia-northeast3' }}
          ASR_CLOUD_RUN_SERVICE: ${{ vars.ASR_CLOUD_RUN_SERVICE || 'asr-sentence-reading' }}
          ASR_SHADOWING_PRACTICE: ${{ vars.ASR_SHADOWING_PRACTICE || '0' }}
          ASR_LOGIN_REQUIRED: ${{ vars.ASR_LOGIN_REQUIRED || '1' }}
          ASR_WORKER_URL: ${{ vars.ASR_WORKER_URL || '' }}
          ASR_WORKER_SECRET: ${{ secrets.ASR_WORKER_SECRET }}
          ASR_CAPACITY_PROFILE: ${{ vars.ASR_CAPACITY_PROFILE || 'turn0-baseline-off' }}
          ASR_CD_SKIP_API_ENABLE: "1"
        run: bash scripts/deploy_capacity_profile.sh "$ASR_CAPACITY_PROFILE"

      - name: Verify live figure pipeline (design/154)
        run: |
          python scripts/verify_live_status.py \
            --require-azure-layout \
            --min-pipeline rich-v20
