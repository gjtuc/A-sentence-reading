# design/316 — solo worker CD is retired.
# Worker code lives in the same image as the API. A worker-only deploy
# either reused a stale API digest or built a second digest. Use the
# pair workflow (Deploy Cloud Run) instead.
name: Deploy Cloud Run Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/sentence_reading/worker/**"
      - "src/sentence_reading/llm/ingest_worker_wake.py"
      - "src/sentence_reading/llm/ingest_jobs_gcs.py"
      - "scripts/deploy_cloud_run_worker.sh"
      - ".github/workflows/deploy-cloud-run-worker.yml"

concurrency:
  group: asr-cloud-pair
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: ${{ vars.ASR_CD_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse solo worker deploy (design/316)
        run: |
          echo "design/316: solo worker CD is retired."
          echo "Worker and API share one image. Run 'Deploy Cloud Run' so"
          echo "scripts/deploy_cloud_run_pair.sh ships both at the same digest."
          echo "This job does not call gcloud."
