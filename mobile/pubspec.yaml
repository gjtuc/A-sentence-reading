name: sentence_reading
description: Android Flutter client for A-sentence-reading Cloud Run API
publish_to: "none"
version: 0.3.90+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  google_sign_in: ^6.2.2
  flutter_web_auth_2: ^4.0.1
  # WHY: single-PDF pick from device storage for Cloud Run ingest (design/70).
  # EDGE: 8.x AAR metadata targets android-34; 10.x matches compileSdk 36 + lifecycle.
  file_picker: ^10.3.2
  # WHY (design/71): content_hash match for same-file resume + local draft PDF path.
  crypto: ^3.0.6
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

