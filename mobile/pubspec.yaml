name: sentence_reading
description: Android Flutter client for A-sentence-reading Cloud Run API
publish_to: "none"
version: 0.3.509+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http_parser: ^4.0.2
  http: ^1.2.0
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  google_sign_in: ^6.2.2
  flutter_web_auth_2: ^4.0.1
  # WHY: single-PDF pick from device storage for Cloud Run ingest (design/70).
  file_picker: ^10.3.2
  # WHY (design/71): content_hash match for same-file resume + local draft PDF path.
  crypto: ^3.0.6
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  camera: 0.10.6
  image: ^4.5.4
  path: ^1.9.1
  package_info_plus: ^8.3.0
  # WHY: keep screen on only during focus practice session (hands-free speaking).
  wakelock_plus: ^1.2.8
  # WHY (design/409): IndexedDB paper storage on the web build.
  web: ^1.1.1
  # WHY (design/410): phone <-> web paper sync over a direct data channel.
  flutter_webrtc: 1.6.2+hotfix.3
  # WHY (design/456): .docx head text on the web, where the phone's Kotlin reader is absent.
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # design/414 — web reader book font (SIL Open Font License, Adobe Source Serif 4).
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-It.ttf
          style: italic
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
    # design/436 — reading fonts for web and phone (SIL Open Font License,
    # static instances from Google Fonts; licences in assets/fonts/OFL-*.txt).
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    # design/472 — Hangul for the web (SIL Open Font License, Noto Sans KR cut to
    # the 2,350 KS X 1001 syllables; licence in assets/fonts/OFL-NotoSansKR.txt).
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
